<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dating Coach AI</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f0a1a;
  color: #e8e0f0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(236,72,153,0.1));
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.logo { font-size: 22px; font-weight: 800; }
.logo span { background: linear-gradient(135deg, #a78bfa, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.hdr-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: #bbb;
  font-size: 13px;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.15s;
  font-family: inherit;
}
.hdr-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.hdr-btn.active { background: rgba(139,92,246,0.2); color: #c4b5fd; border-color: rgba(139,92,246,0.3); }

/* ── Welcome / Scenario Select ── */
.welcome-screen {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
}
.welcome-screen.hidden { display: none; }
.welcome {
  text-align: center;
  max-width: 640px;
}
.welcome h1 {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #a78bfa, #ec4899, #f97316);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.welcome p { color: #888; font-size: 16px; margin-bottom: 32px; line-height: 1.5; }
.mode-label { color: #777; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 12px; }
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 24px; }
.scenario-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}
.scenario-card:hover { border-color: rgba(139,92,246,0.3); background: rgba(139,92,246,0.05); }
.scenario-card .sc-name { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 4px; }
.scenario-card .sc-desc { font-size: 12px; color: #777; line-height: 1.3; }

.advice-btn {
  background: linear-gradient(135deg, #a78bfa, #ec4899);
  border: none;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  padding: 14px 32px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.advice-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(167,139,250,0.3); }

/* ── Chat Screen ── */
.chat-screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
.chat-screen.active { display: flex; }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.message {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.5;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.message.assistant {
  background: rgba(139,92,246,0.12);
  border: 1px solid rgba(139,92,246,0.15);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.message.user {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.message .coach-tip {
  display: block;
  margin-top: 10px;
  padding: 8px 12px;
  background: rgba(236,72,153,0.1);
  border-left: 3px solid #ec4899;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: #f9a8d4;
}
.message .msg-audio {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.play-btn {
  background: rgba(139,92,246,0.2);
  border: none;
  color: #c4b5fd;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.play-btn:hover { background: rgba(139,92,246,0.35); }
.play-btn.playing { background: #a78bfa; color: #fff; }

.typing-indicator {
  align-self: flex-start;
  padding: 12px 20px;
  background: rgba(139,92,246,0.08);
  border-radius: 16px;
  display: none;
}
.typing-indicator.active { display: flex; gap: 4px; }
.typing-dot {
  width: 8px;
  height: 8px;
  background: #a78bfa;
  border-radius: 50%;
  animation: typingPulse 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingPulse { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }

/* ── Input Area ── */
.input-area {
  padding: 16px 24px;
  background: rgba(15,10,26,0.9);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
  backdrop-filter: blur(20px);
}
.text-input {
  flex: 1;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  color: #e8e0f0;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.4;
}
.text-input:focus { border-color: rgba(139,92,246,0.4); }
.text-input::placeholder { color: #555; }

.voice-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(139,92,246,0.3);
  background: rgba(139,92,246,0.1);
  color: #c4b5fd;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.voice-btn:hover { background: rgba(139,92,246,0.2); border-color: rgba(139,92,246,0.5); }
.voice-btn.recording {
  background: #ef4444;
  border-color: #ef4444;
  color: #fff;
  animation: recordPulse 1.5s infinite;
}
@keyframes recordPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); } }

.send-btn {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #a78bfa, #ec4899);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── Feedback Panel ── */
.feedback-panel {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}
.feedback-panel.active { display: flex; }
.feedback-card {
  background: #1a1028;
  border: 1px solid rgba(139,92,246,0.2);
  border-radius: 16px;
  padding: 32px;
  max-width: 560px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}
.feedback-card h2 {
  font-size: 22px;
  margin-bottom: 16px;
  background: linear-gradient(135deg, #a78bfa, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.feedback-text { font-size: 15px; line-height: 1.7; color: #ccc; white-space: pre-wrap; }
.feedback-close {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: rgba(139,92,246,0.15);
  border: 1px solid rgba(139,92,246,0.2);
  color: #c4b5fd;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

/* ── Recording Overlay ── */
.recording-overlay {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #ef4444;
  color: #fff;
  padding: 10px 24px;
  border-radius: 24px;
  font-weight: 700;
  font-size: 14px;
  display: none;
  align-items: center;
  gap: 8px;
  z-index: 20;
  box-shadow: 0 4px 20px rgba(239,68,68,0.4);
}
.recording-overlay.active { display: flex; }
.rec-dot { width: 10px; height: 10px; background: #fff; border-radius: 50%; animation: recBlink 1s infinite; }
@keyframes recBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── Responsive ── */
@media (max-width: 600px) {
  .scenario-grid { grid-template-columns: 1fr 1fr; }
  .message { max-width: 90%; }
  .welcome h1 { font-size: 28px; }
}
</style>
</head>
<body>

<!-- Welcome Screen -->
<div class="welcome-screen" id="welcomeScreen">
  <div class="welcome">
    <h1>Dating Coach AI</h1>
    <p>Practice conversations, get real-time feedback, and level up your dating skills — all with voice or text.</p>

    <div class="mode-label">Practice Scenarios</div>
    <div class="scenario-grid" id="scenarioGrid"></div>

    <div class="mode-label" style="margin-top:24px">Or</div>
    <button class="advice-btn" onclick="startAdvice()" style="margin-top:12px">
      💬 Just Chat — Ask Me Anything
    </button>
  </div>
</div>

<!-- Chat Screen -->
<div class="chat-screen" id="chatScreen">
  <div class="header">
    <div class="logo"><span>Coach</span></div>
    <div class="header-actions">
      <button class="hdr-btn" onclick="getFeedback()" id="feedbackBtn">📊 Get Feedback</button>
      <button class="hdr-btn" onclick="resetSession()">↩ New Session</button>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>
  <div class="input-area">
    <textarea class="text-input" id="textInput" rows="1" placeholder="Type a message or hold the mic to talk..." onkeydown="handleKeydown(event)"></textarea>
    <button class="voice-btn" id="voiceBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
    <button class="send-btn" id="sendBtn" onclick="sendText()">➤</button>
  </div>
</div>

<!-- Recording Overlay -->
<div class="recording-overlay" id="recordingOverlay">
  <div class="rec-dot"></div>
  Recording... release to send
</div>

<!-- Feedback Panel -->
<div class="feedback-panel" id="feedbackPanel">
  <div class="feedback-card">
    <h2>Session Feedback</h2>
    <div class="feedback-text" id="feedbackText">Loading...</div>
    <button class="feedback-close" onclick="closeFeedback()">Close</button>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────
let sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let currentAudio = null;

// ─── Init ────────────────────────────────────────────────────
async function init() {
  const res = await fetch('/api/scenarios');
  const data = await res.json();
  const grid = document.getElementById('scenarioGrid');
  grid.innerHTML = data.scenarios.map(s => \`
    <div class="scenario-card" onclick="startScenario('\${s.key}')">
      <div class="sc-name">\${s.name}</div>
      <div class="sc-desc">\${s.description}</div>
    </div>
  \`).join('');
}

// ─── Start Session ───────────────────────────────────────────
async function startScenario(key) {
  sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
  showChat();
  showTyping();

  const res = await fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, scenario: key, mode: 'practice' })
  });
  const data = await res.json();
  hideTyping();
  addMessage('assistant', data.reply, data.audio);
}

async function startAdvice() {
  sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
  showChat();
  showTyping();
  document.getElementById('feedbackBtn').style.display = 'none';

  const res = await fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, mode: 'advice' })
  });
  const data = await res.json();
  hideTyping();
  addMessage('assistant', data.reply, data.audio);
}

// ─── Send Text ───────────────────────────────────────────────
async function sendText() {
  const input = document.getElementById('textInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', msg);
  showTyping();

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, message: msg })
  });
  const data = await res.json();
  hideTyping();
  addMessage('assistant', data.reply, data.audio);
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  // Auto-resize
  setTimeout(() => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }, 0);
}

// ─── Voice Recording ─────────────────────────────────────────
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length === 0) return;

      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', blob, 'recording.webm');
      formData.append('sessionId', sessionId);

      showTyping();

      try {
        const res = await fetch('/api/voice', { method: 'POST', body: formData });
        const data = await res.json();
        hideTyping();

        if (data.transcript) addMessage('user', data.transcript);
        if (data.reply) addMessage('assistant', data.reply, data.audio);
      } catch (err) {
        hideTyping();
        console.error('Voice error:', err);
      }
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('recordingOverlay').classList.add('active');
  } catch (err) {
    console.error('Mic access denied:', err);
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('voiceBtn').classList.remove('recording');
    document.getElementById('recordingOverlay').classList.remove('active');
  }
}

// ─── Audio Playback ──────────────────────────────────────────
function playAudio(base64, btnEl) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (!base64) return;

  const audio = new Audio('data:audio/mp3;base64,' + base64);
  currentAudio = audio;
  if (btnEl) btnEl.classList.add('playing');

  audio.onended = () => {
    currentAudio = null;
    if (btnEl) btnEl.classList.remove('playing');
  };
  audio.play();
}

// ─── Messages ────────────────────────────────────────────────
function addMessage(role, text, audioBase64) {
  const container = document.getElementById('chatMessages');
  const typing = document.getElementById('typingIndicator');

  const div = document.createElement('div');
  div.className = \`message \${role}\`;

  // Parse coach tips
  let html = escapeHtml(text);
  html = html.replace(/\\[COACH TIP:(.*?)\\]/gs, '<span class="coach-tip">💡 $1</span>');

  div.innerHTML = html;

  // Audio button for assistant messages
  if (role === 'assistant' && audioBase64) {
    const audioDiv = document.createElement('div');
    audioDiv.className = 'msg-audio';
    const btn = document.createElement('button');
    btn.className = 'play-btn';
    btn.textContent = '▶';
    btn.onclick = () => playAudio(audioBase64, btn);
    audioDiv.appendChild(btn);
    const label = document.createElement('span');
    label.style.cssText = 'font-size:12px;color:#888';
    label.textContent = 'Play voice';
    audioDiv.appendChild(label);
    div.appendChild(audioDiv);

    // Auto-play
    setTimeout(() => playAudio(audioBase64, btn), 300);
  }

  container.insertBefore(div, typing);
  container.scrollTop = container.scrollHeight;
}

// ─── Feedback ────────────────────────────────────────────────
async function getFeedback() {
  document.getElementById('feedbackPanel').classList.add('active');
  document.getElementById('feedbackText').textContent = 'Analyzing your conversation...';

  const res = await fetch('/api/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId })
  });
  const data = await res.json();
  document.getElementById('feedbackText').textContent = data.feedback;
  if (data.audio) playAudio(data.audio);
}

function closeFeedback() {
  document.getElementById('feedbackPanel').classList.remove('active');
}

// ─── UI Helpers ──────────────────────────────────────────────
function showChat() {
  document.getElementById('welcomeScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.add('active');
  document.getElementById('chatMessages').innerHTML = '<div class="typing-indicator" id="typingIndicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  document.getElementById('feedbackBtn').style.display = '';
}

function resetSession() {
  document.getElementById('chatScreen').classList.remove('active');
  document.getElementById('welcomeScreen').classList.remove('hidden');
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
}

function showTyping() { document.getElementById('typingIndicator').classList.add('active'); scrollToBottom(); }
function hideTyping() { document.getElementById('typingIndicator').classList.remove('active'); }
function scrollToBottom() { const c = document.getElementById('chatMessages'); c.scrollTop = c.scrollHeight; }

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

init();
</script>
</body>
</html>
